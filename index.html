<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلتي — الجيم والتعافي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --card:#111111;
    --card-border:#2E2E2E;
    --accent:#FFFFFF;
    --accent-glow:rgba(255,255,255,.20);
    --accent2:#8A8A8A;
    --text:#FFFFFF;
    --text-dim:#9A9A9A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(255,255,255,.07), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(255,255,255,.04), transparent 35%),
      var(--bg);
    color:var(--text);
    font-family:'Changa',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
  }
  #topHeader{
    padding:22px 18px 14px 18px;
    position:sticky;
    top:0;
    background:rgba(10,11,14,.92);
    backdrop-filter:blur(10px);
    z-index:10;
    border-bottom:1px solid var(--card-border);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:2px;
  }
  .lang-btn{
    background:none;
    border:1px solid var(--card-border);
    color:var(--text-dim);
    font-family:'Changa',sans-serif;
    font-size:12px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .brand-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent-glow);
  }
  h1{
    font-family:'Lalezar',sans-serif;
    font-size:26px;
    font-weight:400;
    letter-spacing:.5px;
    margin:0;
    background:linear-gradient(90deg,#FFFFFF,#8A8A8A);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .subtitle{
    color:var(--text-dim);
    font-size:12.5px;
    margin:4px 0 14px 0;
    font-weight:400;
  }
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text-dim);
    font-family:'Changa',sans-serif;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .tab.active{
    background:var(--accent);
    color:#0A0B0E;
    border-color:var(--accent);
    box-shadow:0 0 16px var(--accent-glow);
  }
  main{padding:16px 18px 0 18px;}
  .section-title{
    font-size:14px;
    color:var(--text-dim);
    margin:2px 0 14px 0;
    font-weight:700;
  }
  .section-title b{color:var(--text);font-weight:800;}
  .hero-card{
    background:linear-gradient(135deg,#1A1A1A,#111111 60%);
    border:1px solid var(--accent-glow);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
  }
  .hero-card::after{
    content:'';
    position:absolute;
    top:-40px;right:-40px;
    width:120px;height:120px;
    background:var(--accent);
    opacity:.12;
    border-radius:50%;
    filter:blur(10px);
  }
  .hero-label{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.3px;}
  .hero-value{font-family:'Lalezar',sans-serif;font-size:24px;font-weight:400;letter-spacing:.3px;margin:4px 0 2px 0;}
  .hero-sub{font-size:12.5px;color:var(--text-dim);}
  .quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .music-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .music-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px 8px;
    text-decoration:none;
    color:var(--text);
    font-family:'Changa',sans-serif;
    font-size:12px;
    font-weight:700;
  }
  .music-btn .micon{font-size:24px;}
  .music-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
  }
  .music-grid .music-btn{padding:26px 10px;font-size:14px;}
  .music-grid .micon{font-size:32px;}
  .quick-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px;
  }
  .quick-card .qlabel{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
  .quick-card .qvalue{font-size:17px;font-weight:800;}
  .quick-card .qvalue.ok{color:var(--accent);}
  .go-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--accent);
    color:#0A0B0E;
    font-family:'Changa',sans-serif;
    font-weight:800;
    font-size:14px;
    border:none;
    border-radius:12px;
    padding:13px;
    margin-bottom:14px;
    cursor:pointer;
    box-shadow:0 4px 18px var(--accent-glow);
  }
  .progress-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    font-size:13px;
    color:var(--text-dim);
    gap:10px;
  }
  .progress-track{
    flex:1;
    height:7px;
    background:var(--card-border);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),#CFCFCF);
    border-radius:99px;
    transition:width .25s ease;
    width:0%;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    transition:border-color .2s ease;
  }
  .card.done{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset;
  }
  .card-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .icon-wrap{
    flex:0 0 auto;
    width:52px;
    height:52px;
    border-radius:13px;
    background:#1C2027;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    font-size:22px;
    overflow:hidden;
  }
  .card.done .icon-wrap{color:var(--accent);}
  .icon-wrap svg{width:28px;height:28px;stroke:currentColor;}
  .icon-wrap img{width:100%;height:100%;object-fit:cover;border-radius:13px;}
  .name-block{flex:1;min-width:0;}
  .ex-name{font-size:16px;font-weight:800;margin:0 0 2px 0;}
  .ex-equip{font-size:12.5px;color:var(--text-dim);margin:0;}
  .how-to{
    font-size:13.5px;
    line-height:1.75;
    color:#C9CDD4;
    margin:0 0 12px 0;
  }
  .ex-video{
    width:100%;
    max-height:220px;
    border-radius:12px;
    background:#000;
    margin-bottom:12px;
    display:block;
  }
  .yt-wrap{position:relative;width:100%;max-width:260px;margin:0 auto 12px auto;padding-top:177.78%;border-radius:12px;overflow:hidden;background:#000;}
  .yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .yt-wrap-h{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px;}
  .yt-wrap-h iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .alt-label{font-size:12.5px;color:var(--text-dim);margin:4px 0 8px 0;}
  .alt-label b{color:var(--accent);}
  .card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .sets-badge{
    background:#1C2027;
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:700;
    padding:6px 12px;
    border-radius:8px;
  }
  .carbs-badge{
    background:rgba(255,255,255,.12);
    color:var(--accent);
    font-size:12px;
    font-weight:800;
    padding:6px 12px;
    border-radius:8px;
  }
  .right-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .weight-input{
    width:70px;
    background:#1C2027;
    border:1px solid var(--card-border);
    color:var(--text);
    font-family:'Changa',sans-serif;
    font-size:13px;
    padding:6px 8px;
    border-radius:8px;
    text-align:center;
  }
  .weight-input::placeholder{color:#5A606B;}
  .done-btn{
    border:1px solid var(--card-border);
    background:#1C2027;
    color:var(--text-dim);
    font-family:'Changa',sans-serif;
    font-size:13px;
    font-weight:800;
    padding:8px 16px;
    border-radius:9px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .done-btn.on{
    background:var(--accent);
    color:#0A0B0E;
    border-color:var(--accent);
    box-shadow:0 0 14px var(--accent-glow);
  }
  .reset-row{
    text-align:center;
    margin-top:18px;
  }
  .reset-btn{
    background:none;
    border:none;
    color:#5A606B;
    font-family:'Changa',sans-serif;
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }
  .tip-box{
    background:linear-gradient(135deg,#161616,#111111);
    border:1px solid #333333;
    border-radius:12px;
    padding:12px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:16px;
    line-height:1.7;
  }
  .tip-box b{color:var(--accent);font-weight:800;}
  /* weight tab */
  .weight-form{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .weight-form input{
    flex:1;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text);
    font-family:'Changa',sans-serif;
    font-size:14px;
    padding:12px;
    border-radius:12px;
  }
  .weight-form button{
    background:var(--accent);
    color:#0A0B0E;
    border:none;
    font-family:'Changa',sans-serif;
    font-weight:800;
    font-size:14px;
    padding:0 20px;
    border-radius:12px;
    cursor:pointer;
  }
  .chart-wrap{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:14px;
    margin-bottom:16px;
  }
  .log-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    margin-bottom:8px;
    font-size:13.5px;
  }
  .log-date{color:var(--text-dim);font-size:12px;}
  .log-w{font-weight:800;font-size:15px;}
  .delta{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:99px;}
  .delta.up{background:rgba(255,255,255,.14);color:var(--accent);}
  .delta.down{background:rgba(138,138,138,.16);color:var(--accent2);}
  .delta.same{background:#1C2027;color:var(--text-dim);}
  .empty-note{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:30px 10px;
  }
  /* bottom nav */
  #bottomNav{
    position:fixed;
    bottom:0;left:0;right:0;
    background:rgba(15,17,21,.95);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--card-border);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    z-index:20;
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'Changa',sans-serif;
    font-size:11px;
    font-weight:700;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 2px;
    cursor:pointer;
    border-radius:12px;
  }
  .nav-btn .nicon{font-size:19px;}
  .nav-btn.active{color:var(--accent);}
</style>
</head>
<body>

<div id="topHeader">
  <div class="brand">
    <div class="brand-dot"></div>
    <h1 id="brandTitle">رحلتي</h1>
    <button id="langBtn" class="lang-btn">EN</button>
  </div>
  <p class="subtitle" id="headerSub">أول مرة في الجيم — 5 أيام في الأسبوع لبناء العضل</p>
  <div class="tabs" id="subTabs"></div>
</div>

<main id="mainContent"></main>

<nav id="bottomNav">
  <button class="nav-btn" data-section="home"><span class="nicon">🏠</span>الرئيسية</button>
  <button class="nav-btn" data-section="exercises"><span class="nicon">🏋️</span>التمارين</button>
  <button class="nav-btn" data-section="food"><span class="nicon">🍽️</span>الأكل</button>
  <button class="nav-btn" data-section="weight"><span class="nicon">⚖️</span>الوزن</button>
  <button class="nav-btn" data-section="music"><span class="nicon">🎵</span>الموسيقى</button>
</nav>

<script>
let LANG = localStorage.getItem('lang') || 'ar';

function tr(ar, en){
  return LANG === 'en' ? (en || ar) : ar;
}

function applyLangToDocument(){
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = LANG;
  document.getElementById('langBtn').textContent = LANG === 'ar' ? 'EN' : 'AR';
  document.getElementById('brandTitle').textContent = tr('رحلتي', 'My Journey');
}

const NAV_LABELS = {
  home: {ar:'الرئيسية', en:'Home'},
  exercises: {ar:'التمارين', en:'Workouts'},
  food: {ar:'الأكل', en:'Food'},
  weight: {ar:'الوزن', en:'Weight'},
  music: {ar:'الموسيقى', en:'Music'},
};

function renderNavLabels(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    const key = btn.dataset.section;
    const icon = btn.querySelector('.nicon').outerHTML;
    btn.innerHTML = icon + tr(NAV_LABELS[key].ar, NAV_LABELS[key].en);
  });
}

const ICONS = {
  barbell: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="8" y1="24" x2="40" y2="24"/><rect x="4" y="16" width="6" height="16" rx="1.5"/><rect x="38" y="16" width="6" height="16" rx="1.5"/><rect x="12" y="19" width="4" height="10" rx="1"/><rect x="32" y="19" width="4" height="10" rx="1"/></svg>`,
  dumbbell: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="16" y1="24" x2="32" y2="24"/><rect x="8" y="17" width="8" height="14" rx="2"/><rect x="32" y="17" width="8" height="14" rx="2"/></svg>`,
  squatRack: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="10" y1="8" x2="10" y2="40"/><line x1="38" y1="8" x2="38" y2="40"/><line x1="6" y1="20" x2="42" y2="20"/><rect x="2" y="16" width="8" height="8" rx="1.5"/><rect x="38" y="16" width="8" height="8" rx="1.5"/></svg>`,
  seatedMachine: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><rect x="8" y="8" width="10" height="26" rx="2"/><line x1="18" y1="20" x2="36" y2="20"/><rect x="34" y="14" width="8" height="18" rx="1.5"/><line x1="36" y1="18" x2="40" y2="18"/><line x1="36" y1="23" x2="40" y2="23"/><line x1="36" y1="28" x2="40" y2="28"/></svg>`,
  flyMachine: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><rect x="19" y="10" width="10" height="24" rx="2"/><path d="M19 18 C10 18 8 26 6 30"/><path d="M29 18 C38 18 40 26 42 30"/></svg>`,
  cableTower: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="4" x2="12" y2="44"/><circle cx="12" cy="8" r="3"/><path d="M12 8 C22 8 26 20 30 30"/><rect x="28" y="30" width="4" height="10" rx="1"/><line x1="36" y1="6" x2="36" y2="34"/><line x1="33" y1="10" x2="39" y2="10"/><line x1="33" y1="16" x2="39" y2="16"/><line x1="33" y1="22" x2="39" y2="22"/></svg>`,
  assistedMachine: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="10" y1="6" x2="10" y2="42"/><line x1="38" y1="6" x2="38" y2="42"/><line x1="10" y1="10" x2="38" y2="10"/><line x1="4" y1="20" x2="14" y2="20"/><line x1="34" y1="20" x2="44" y2="20"/><rect x="17" y="30" width="14" height="10" rx="1.5"/></svg>`,
  legSled: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 38 L20 14 L42 14"/><rect x="18" y="9" width="4" height="10" rx="1"/><rect x="26" y="9" width="4" height="10" rx="1"/><rect x="34" y="9" width="4" height="10" rx="1"/><line x1="4" y1="38" x2="18" y2="38"/></svg>`,
  legMachine: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><rect x="6" y="20" width="24" height="8" rx="2"/><line x1="30" y1="24" x2="30" y2="10"/><rect x="28" y="6" width="10" height="6" rx="1.5"/><line x1="10" y1="28" x2="10" y2="40"/></svg>`,
  preacherBench: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M8 40 L8 26 L26 14"/><rect x="22" y="10" width="12" height="8" rx="2" transform="rotate(20 22 10)"/><line x1="8" y1="40" x2="20" y2="40"/></svg>`
};

const DAYS = [
  {id:'d1', label:'Push 1', full:'يوم 1 — Push', fullEn:'Day 1 — Push', weekday:0},
  {id:'d2', label:'Pull 1', full:'يوم 2 — Pull', fullEn:'Day 2 — Pull', weekday:1},
  {id:'d3', label:'رجل 1', labelEn:'Legs 1', full:'يوم 3 — رجل + قطنية', fullEn:'Day 3 — Legs + Lower Back', weekday:2},
  {id:'d4', label:'Push 2', full:'يوم 4 — Push', fullEn:'Day 4 — Push', weekday:3},
  {id:'d5', label:'Pull 2', full:'يوم 5 — Pull', fullEn:'Day 5 — Pull', weekday:4},
  {id:'d6', label:'رجل 2', labelEn:'Legs 2', full:'يوم 6 — رجل + قطنية', fullEn:'Day 6 — Legs + Lower Back', weekday:5},
];

const NUTRITION_MEALS = [
  {time:'الفطار', items:'3 بيضات + رغيفين عيش بلدي + كوب لبن', note:'أرخص وأقوى فطار بروتين.', carbs:50},
  {time:'سناك الصبح', items:'2 معلقة زبدة فول سوداني + موزة', note:'سعرات إضافية اقتصادية لكسب وزن.', carbs:25},
  {time:'سناك بعد التمرين', items:'علبة تونة + رغيف عيش + زبادي', note:'التونة من أرخص مصادر البروتين عالي الجودة.', carbs:30},
  {time:'العشا', items:'فول أو جبن قريش + بيضة + عيش بلدي', note:'', carbs:25},
  {time:'قبل النوم', items:'كوب لبن + معلقة زبدة فول سوداني', note:'سعرات بسيطة إضافية وانت نايم.', carbs:5},
  {time:'شيك بديل الماس جينر (اختياري)', items:'كوب لبن + 3 معالق شوفان + معلقتين زبدة فول سوداني + موزة + عسل', note:'حوالي 700-800 سعر حراري، أرخص بكتير من علبة الماس جينر الجاهزة.', carbs:70, special:true},
];
const BASE_CARBS = NUTRITION_MEALS.reduce((s,m)=>s+m.carbs,0);

const LUNCH_ROTATION = [

function getTodayLunch(){
  const jsDay = new Date().getDay();
  return LUNCH_ROTATION.find(l=>l.weekday===jsDay) || LUNCH_ROTATION[0];
}
function getTodayTotalCarbs(){
  return BASE_CARBS + getTodayLunch().carbs;
}

let currentSection = 'home';
let currentDay = 'd1';
let stateCache = {};

function loadState(key, fallback){
  if(stateCache[key] !== undefined) return stateCache[key];
  try{
    const raw = localStorage.getItem(key);
    const val = raw ? JSON.parse(raw) : fallback;
    stateCache[key] = val;
    return val;
  }catch(e){
    stateCache[key] = fallback;
    return fallback;
  }
}
function saveState(key, val){
  stateCache[key] = val;
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error(e); }
}

function setActiveNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.section === currentSection);
  });
}

function renderSubTabs(){
  const wrap = document.getElementById('subTabs');
  wrap.innerHTML = '';
  if(currentSection !== 'exercises'){ wrap.style.display='none'; return; }
  wrap.style.display='flex';
  DAYS.forEach(d=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (d.id===currentDay ? ' active' : '');
    btn.textContent = d.label;
    btn.onclick = ()=>{ currentDay = d.id; renderSubTabs(); renderExercises(); };
    wrap.appendChild(btn);
  });
}

function buildChartSVG(entries){
  if(entries.length < 2){
    return `<div class="empty-note">سجّل وزنك مرتين على الأقل عشان يظهر الرسم البياني</div>`;
  }
  const w = 300, h = 140, pad = 20;
  const weights = entries.map(e=>e.weight);
  const min = Math.min(...weights) - 1;
  const max = Math.max(...weights) + 1;
  const xStep = (w - pad*2) / (entries.length - 1);
  const points = entries.map((e,i)=>{
    const x = pad + i*xStep;
    const y = h - pad - ((e.weight - min)/(max-min))*(h-pad*2);
    return `${x},${y}`;
  }).join(' ');
  const dots = entries.map((e,i)=>{
    const x = pad + i*xStep;
    const y = h - pad - ((e.weight - min)/(max-min))*(h-pad*2);
    return `<circle cx="${x}" cy="${y}" r="3.5" fill="#FFFFFF"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    <polyline points="${points}" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

async function renderWeight(){
  document.getElementById('headerSub').textContent = tr(HEADER_SUBS.weight.ar, HEADER_SUBS.weight.en);
  const wrap = document.getElementById('mainContent');
  const log = await loadState('weightlog', []);
  const today = new Date().toISOString().slice(0,10);

  let logHtml = '';
  if(log.length === 0){
    logHtml = `<div class="empty-note">لسه معملتش أي تسجيل. سجّل وزنك الأول 👆</div>`;
  }else{
    for(let i=log.length-1;i>=0;i--){
      const e = log[i];
      let deltaHtml = '';
      if(i>0){
        const d = (e.weight - log[i-1].weight).toFixed(1);
        const cls = d>0?'up':(d<0?'down':'same');
        deltaHtml = `<span class="delta ${cls}">${d>0?'+':''}${d} كجم</span>`;
      }
      logHtml += `<div class="log-row"><div><div class="log-w">${e.weight} كجم</div><div class="log-date">${e.date}</div></div>${deltaHtml}</div>`;
    }
  }

  const first = log[0];
  const last = log[log.length-1];
  const totalDiff = (first && last && log.length>1) ? (last.weight-first.weight).toFixed(1) : null;

  wrap.innerHTML = `
    <div class="hero-card">
      <div class="hero-label">إجمالي التغيير</div>
      <div class="hero-value">${totalDiff !== null ? (totalDiff>0?'+':'')+totalDiff+' كجم' : '—'}</div>
      <div class="hero-sub">${log.length>0 ? 'من أول تسجيل لحد دلوقتي' : 'سجّل وزنك كل أسبوع عشان يبان الفرق'}</div>
    </div>
    <div class="weight-form">
      <input type="date" id="wDate" value="${today}">
      <input type="number" id="wValue" placeholder="الوزن بالكيلو" inputmode="decimal">
      <button id="wAddBtn">إضافة</button>
    </div>
    <div class="chart-wrap">${buildChartSVG(log)}</div>
    <div id="logList">${logHtml}</div>
  `;

  document.getElementById('wAddBtn').addEventListener('click', async ()=>{
    const dateVal = document.getElementById('wDate').value || today;
    const wVal = parseFloat(document.getElementById('wValue').value);
    if(!wVal || wVal <= 0) return;
    const newLog = log.filter(e=>e.date !== dateVal);
    newLog.push({date:dateVal, weight:wVal});
    newLog.sort((a,b)=> a.date.localeCompare(b.date));
    await saveState('weightlog', newLog);
    renderWeight();
  });
}

      <a class="music-btn" href="https://play.anghami.com" target="_blank" rel="noopener"><span class="micon">🎶</span>${tr('أنغامي','Anghami')}</a>
    </div>
  `;
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchSection(btn.dataset.section));
});

document.getElementById('langBtn').addEventListener('click', ()=>{
  LANG = LANG === 'ar' ? 'en' : 'ar';
  localStorage.setItem('lang', LANG);
  applyLangToDocument();
  renderNavLabels();
  renderSubTabs();
  switchSection(currentSection);
});

applyLangToDocument();
renderNavLabels();
switchSection('home');
</script>
