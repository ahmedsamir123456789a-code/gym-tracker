<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطة الجيم بتاعتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0A14;
    --card:#181420;
    --card-border:#2C2438;
    --accent:#FF7A45;
    --accent-glow:rgba(255,122,69,.28);
    --accent2:#7C5CFF;
    --text:#F8F5FA;
    --text-dim:#9C93AA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(255,122,69,.12), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(124,92,255,.10), transparent 35%),
      var(--bg);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
  }
  #topHeader{
    padding:22px 18px 14px 18px;
    position:sticky;
    top:0;
    background:rgba(10,11,14,.92);
    backdrop-filter:blur(10px);
    z-index:10;
    border-bottom:1px solid var(--card-border);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:2px;
  }
  .brand-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent-glow);
  }
  h1{
    font-size:21px;
    font-weight:900;
    margin:0;
    background:linear-gradient(90deg,#fff,#B9C0CC);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{
    color:var(--text-dim);
    font-size:12.5px;
    margin:4px 0 14px 0;
    font-weight:400;
  }
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text-dim);
    font-family:'Cairo',sans-serif;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .tab.active{
    background:var(--accent);
    color:#0A0B0E;
    border-color:var(--accent);
    box-shadow:0 0 16px var(--accent-glow);
  }
  main{padding:16px 18px 0 18px;}
  .section-title{
    font-size:14px;
    color:var(--text-dim);
    margin:2px 0 14px 0;
    font-weight:700;
  }
  .section-title b{color:var(--text);font-weight:800;}
  .hero-card{
    background:linear-gradient(135deg,#2A1710,#181420 60%);
    border:1px solid var(--accent-glow);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
  }
  .hero-card::after{
    content:'';
    position:absolute;
    top:-40px;right:-40px;
    width:120px;height:120px;
    background:var(--accent);
    opacity:.12;
    border-radius:50%;
    filter:blur(10px);
  }
  .hero-label{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.3px;}
  .hero-value{font-size:22px;font-weight:900;margin:4px 0 2px 0;}
  .hero-sub{font-size:12.5px;color:var(--text-dim);}
  .quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .music-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .music-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px 8px;
    text-decoration:none;
    color:var(--text);
    font-family:'Cairo',sans-serif;
    font-size:12px;
    font-weight:700;
  }
  .music-btn .micon{font-size:24px;}
  .music-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
  }
  .music-grid .music-btn{
    padding:26px 10px;
    font-size:14px;
  }
  .music-grid .micon{font-size:32px;}
  .quick-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px;
  }
  .quick-card .qlabel{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
  .quick-card .qvalue{font-size:17px;font-weight:800;}
  .quick-card .qvalue.ok{color:var(--accent);}
  .go-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--accent);
    color:#0A0B0E;
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:14px;
    border:none;
    border-radius:12px;
    padding:13px;
    margin-bottom:14px;
    cursor:pointer;
    box-shadow:0 4px 18px var(--accent-glow);
  }
  .progress-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    font-size:13px;
    color:var(--text-dim);
    gap:10px;
  }
  .progress-track{
    flex:1;
    height:7px;
    background:var(--card-border);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),#FFC48A);
    border-radius:99px;
    transition:width .25s ease;
    width:0%;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    transition:border-color .2s ease;
  }
  .card.done{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset;
  }
  .card-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .icon-wrap{
    flex:0 0 auto;
    width:52px;
    height:52px;
    border-radius:13px;
    background:#1C2027;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    font-size:22px;
    overflow:hidden;
  }
  .card.done .icon-wrap{color:var(--accent);}
  .icon-wrap svg{width:28px;height:28px;stroke:currentColor;}
  .icon-wrap img{width:100%;height:100%;object-fit:cover;border-radius:13px;}
  .name-block{flex:1;min-width:0;}
  .ex-name{font-size:16px;font-weight:800;margin:0 0 2px 0;}
  .ex-equip{font-size:12.5px;color:var(--text-dim);margin:0;}
  .how-to{
    font-size:13.5px;
    line-height:1.75;
    color:#C9CDD4;
    margin:0 0 12px 0;
  }
  .ex-video{
    width:100%;
    max-height:220px;
    border-radius:12px;
    background:#000;
    margin-bottom:12px;
    display:block;
  }
  .card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .sets-badge{
    background:#1C2027;
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:700;
    padding:6px 12px;
    border-radius:8px;
  }
  .carbs-badge{
    background:rgba(212,255,62,.1);
    color:var(--accent);
    font-size:12px;
    font-weight:800;
    padding:6px 12px;
    border-radius:8px;
  }
  .right-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .weight-input{
    width:70px;
    background:#1C2027;
    border:1px solid var(--card-border);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    font-size:13px;
    padding:6px 8px;
    border-radius:8px;
    text-align:center;
  }
  .weight-input::placeholder{color:#5A606B;}
  .done-btn{
    border:1px solid var(--card-border);
    background:#1C2027;
    color:var(--text-dim);
    font-family:'Cairo',sans-serif;
    font-size:13px;
    font-weight:800;
    padding:8px 16px;
    border-radius:9px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .done-btn.on{
    background:var(--accent);
    color:#0A0B0E;
    border-color:var(--accent);
    box-shadow:0 0 14px var(--accent-glow);
  }
  .reset-row{
    text-align:center;
    margin-top:18px;
  }
  .reset-btn{
    background:none;
    border:none;
    color:#5A606B;
    font-family:'Cairo',sans-serif;
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }
  .tip-box{
    background:linear-gradient(135deg,#241A12,#181420);
    border:1px solid #5A3A20;
    border-radius:12px;
    padding:12px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:16px;
    line-height:1.7;
  }
  .tip-box b{color:var(--accent);font-weight:800;}
  /* weight tab */
  .weight-form{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .weight-form input{
    flex:1;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    font-size:14px;
    padding:12px;
    border-radius:12px;
  }
  .weight-form button{
    background:var(--accent);
    color:#0A0B0E;
    border:none;
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:14px;
    padding:0 20px;
    border-radius:12px;
    cursor:pointer;
  }
  .chart-wrap{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:14px;
    margin-bottom:16px;
  }
  .log-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    margin-bottom:8px;
    font-size:13.5px;
  }
  .log-date{color:var(--text-dim);font-size:12px;}
  .log-actions{display:flex;align-items:center;gap:10px;}
  .del-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:17px;
    cursor:pointer;
    padding:4px 6px;
  }
  .log-w{font-weight:800;font-size:15px;}
  .delta{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:99px;}
  .delta.up{background:rgba(212,255,62,.12);color:var(--accent);}
  .delta.down{background:rgba(255,91,110,.12);color:var(--accent2);}
  .delta.same{background:#1C2027;color:var(--text-dim);}
  .empty-note{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:30px 10px;
  }
  /* bottom nav */
  #bottomNav{
    position:fixed;
    bottom:0;left:0;right:0;
    background:rgba(15,17,21,.95);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--card-border);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    z-index:20;
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'Cairo',sans-serif;
    font-size:11px;
    font-weight:700;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 2px;
    cursor:pointer;
    border-radius:12px;
  }
  .nav-btn .nicon{font-size:19px;}
  .nav-btn.active{color:var(--accent);}
</style>
</head>
<body>

<div id="topHeader">
  <div class="brand"><div class="brand-dot"></div><h1>خطة الجيم بتاعتي</h1></div>
  <p class="subtitle" id="headerSub">أول مرة في الجيم — 5 أيام في الأسبوع لبناء العضل</p>
  <div class="tabs" id="subTabs"></div>
</div>

<main id="mainContent"></main>

<nav id="bottomNav">
  <button class="nav-btn" data-section="home"><span class="nicon">🏠</span>الرئيسية</button>
  <button class="nav-btn" data-section="exercises"><span class="nicon">🏋️</span>التمارين</button>
  <button class="nav-btn" data-section="food"><span class="nicon">🍽️</span>الأكل</button>
  <button class="nav-btn" data-section="weight"><span class="nicon">⚖️</span>الوزن</button>
  <button class="nav-btn" data-section="music"><span class="nicon">🎵</span>الموسيقى</button>
</nav>

<script>
const ICONS = {
  barbell: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="8" y1="24" x2="40" y2="24"/><rect x="4" y="16" width="6" height="16" rx="1.5"/><rect x="38" y="16" width="6" height="16" rx="1.5"/><rect x="12" y="19" width="4" height="10" rx="1"/><rect x="32" y="19" width="4" height="10" rx="1"/></svg>`,
  dumbbell: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="16" y1="24" x2="32" y2="24"/><rect x="8" y="17" width="8" height="14" rx="2"/><rect x="32" y="17" width="8" height="14" rx="2"/></svg>`,
  squatRack: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="10" y1="8" x2="10" y2="40"/><line x1="38" y1="8" x2="38" y2="40"/><line x1="6" y1="20" x2="42" y2="20"/><rect x="2" y="16" width="8" height="8" rx="1.5"/><rect x="38" y="16" width="8" height="8" rx="1.5"/></svg>`,
  seatedMachine: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><rect x="8" y="8" width="10" height="26" rx="2"/><line x1="18" y1="20" x2="36" y2="20"/><rect x="34" y="14" width="8" height="18" rx="1.5"/><line x1="36" y1="18" x2="40" y2="18"/><line x1="36" y1="23" x2="40" y2="23"/><line x1="36" y1="28" x2="40" y2="28"/></svg>`,
  flyMachine: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><rect x="19" y="10" width="10" height="24" rx="2"/><path d="M19 18 C10 18 8 26 6 30"/><path d="M29 18 C38 18 40 26 42 30"/></svg>`,
  cableTower: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="4" x2="12" y2="44"/><circle cx="12" cy="8" r="3"/><path d="M12 8 C22 8 26 20 30 30"/><rect x="28" y="30" width="4" height="10" rx="1"/><line x1="36" y1="6" x2="36" y2="34"/><line x1="33" y1="10" x2="39" y2="10"/><line x1="33" y1="16" x2="39" y2="16"/><line x1="33" y1="22" x2="39" y2="22"/></svg>`,
  assistedMachine: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="10" y1="6" x2="10" y2="42"/><line x1="38" y1="6" x2="38" y2="42"/><line x1="10" y1="10" x2="38" y2="10"/><line x1="4" y1="20" x2="14" y2="20"/><line x1="34" y1="20" x2="44" y2="20"/><rect x="17" y="30" width="14" height="10" rx="1.5"/></svg>`,
  legSled: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 38 L20 14 L42 14"/><rect x="18" y="9" width="4" height="10" rx="1"/><rect x="26" y="9" width="4" height="10" rx="1"/><rect x="34" y="9" width="4" height="10" rx="1"/><line x1="4" y1="38" x2="18" y2="38"/></svg>`,
  legMachine: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><rect x="6" y="20" width="24" height="8" rx="2"/><line x1="30" y1="24" x2="30" y2="10"/><rect x="28" y="6" width="10" height="6" rx="1.5"/><line x1="10" y1="28" x2="10" y2="40"/></svg>`,
  preacherBench: `<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M8 40 L8 26 L26 14"/><rect x="22" y="10" width="12" height="8" rx="2" transform="rotate(20 22 10)"/><line x1="8" y1="40" x2="20" y2="40"/></svg>`
};

const DAYS = [
  {id:'d1', label:'صدر', full:'يوم 1 — الصدر', weekday:0},
  {id:'d2', label:'ظهر', full:'يوم 2 — الظهر', weekday:1},
  {id:'d3', label:'أرجل', full:'يوم 3 — الأرجل', weekday:2},
  {id:'d4', label:'أكتاف', full:'يوم 4 — الأكتاف', weekday:3},
  {id:'d5', label:'ذراعين', full:'يوم 5 — الذراعين', weekday:4},
];

const NUTRITION_MEALS = [
  {time:'الفطار', items:'3 بيضات + رغيفين عيش بلدي + كوب لبن', note:'أرخص وأقوى فطار بروتين.', carbs:50},
  {time:'سناك الصبح', items:'2 معلقة زبدة فول سوداني + موزة', note:'سعرات إضافية اقتصادية لكسب وزن.', carbs:25},
  {time:'سناك بعد التمرين', items:'علبة تونة + رغيف عيش + زبادي', note:'التونة من أرخص مصادر البروتين عالي الجودة.', carbs:30},
  {time:'العشا', items:'فول أو جبن قريش + بيضة + عيش بلدي', note:'', carbs:25},
  {time:'قبل النوم', items:'كوب لبن + معلقة زبدة فول سوداني', note:'سعرات بسيطة إضافية وانت نايم.', carbs:5},
  {time:'شوفان وفاكهة', items:'نص كوب شوفان بالحليب + فاكهة موسمية (موزة أو تفاحة أو برتقالة)', note:'مصدر كارب وألياف ممتاز، تقدر تاكله بدل الفطار العادي أي يوم للتنويع.', carbs:45},
  {time:'شيك بديل الماس جينر (اختياري)', items:'كوب لبن + 3 معالق شوفان + معلقتين زبدة فول سوداني + موزة + عسل', note:'حوالي 700-800 سعر حراري، أرخص بكتير من علبة الماس جينر الجاهزة.', carbs:70, special:true},
];
const BASE_CARBS = NUTRITION_MEALS.reduce((s,m)=>s+m.carbs,0);

const LUNCH_ROTATION = [
  {weekday:0, day:'الأحد', tag:'🍗 فراخ', items:'فراخ مشوية بالليمون والثوم + أرز بسمتي + سلطة', note:'اسلق أو اشوي صدر الفراخ متتبل بليمون وثوم وكمون — رخيص وبروتين عالي.', carbs:90},
  {weekday:1, day:'الاتنين', tag:'🌱 اقتصادي', items:'عدس أصفر + أرز + خضار', note:'العدس من أرخص مصادر البروتين والألياف في مصر.', carbs:90},
  {weekday:2, day:'الثلاثاء', tag:'🥩 لحمة', items:'لحمة مفرومة بالبصل والفلفل + بطاطس في الفرن', note:'اللحمة المفرومة أرخص من الشرائح وبتديك نفس البروتين تقريبًا.', carbs:70},
  {weekday:3, day:'الأربع', tag:'🌱 اقتصادي', items:'تونة بالمكرونة', note:'وجبة سريعة واقتصادية وعالية البروتين.', carbs:90},
  {weekday:4, day:'الخميس', tag:'🍗 فراخ', items:'شاورما فراخ بيتي متبّلة + أرز بسمتي + سلطة', note:'قطع فراخ متبّلة بالتوم والليمون والبهارات ومشوية في الفرن أو على طاسة — نفس طعم الشاورما وأرخص وأصح من الجاهزة.', carbs:90},
  {weekday:5, day:'الجمعة', tag:'🌱 اقتصادي', items:'فول بالزيت والطماطم + بيضة + عيش بلدي', note:'', carbs:60},
  {weekday:6, day:'السبت', tag:'🥩 لحمة', items:'كبدة بالبصل والفلفل + عيش بلدي', note:'الكبدة رخيصة وغنية بالحديد ومفيدة جدًا لبناء العضل.', carbs:55},
];
function getTodayLunch(){
  const jsDay = new Date().getDay();
  return LUNCH_ROTATION.find(l=>l.weekday===jsDay) || LUNCH_ROTATION[0];
}
function getTodayTotalCarbs(){
  return BASE_CARBS + getTodayLunch().carbs;
}

let currentSection = 'home';
let currentDay = 'd1';
let stateCache = {};

function loadState(key, fallback){
  if(stateCache[key] !== undefined) return stateCache[key];
  try{
    const raw = localStorage.getItem(key);
    const val = raw ? JSON.parse(raw) : fallback;
    stateCache[key] = val;
    return val;
  }catch(e){
    stateCache[key] = fallback;
    return fallback;
  }
}
function saveState(key, val){
  stateCache[key] = val;
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error(e); }
}

function setActiveNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.section === currentSection);
  });
}

function renderSubTabs(){
  const wrap = document.getElementById('subTabs');
  wrap.innerHTML = '';
  if(currentSection !== 'exercises'){ wrap.style.display='none'; return; }
  wrap.style.display='flex';
  DAYS.forEach(d=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (d.id===currentDay ? ' active' : '');
    btn.textContent = d.label;
    btn.onclick = ()=>{ currentDay = d.id; renderSubTabs(); renderExercises(); };
    wrap.appendChild(btn);
  });
}

async function renderExercises(){
  document.getElementById('headerSub').textContent = HEADER_SUBS.exercises;
  const wrap = document.getElementById('mainContent');
  const day = DAYS.find(d=>d.id===currentDay);
  const list = EXERCISES[currentDay];
  let doneCount = 0;

  let cardsHtml = '';
  for(const ex of list){
    const st = await loadState(`ex:${ex.id}`, {done:false, weight:''});
    if(st.done) doneCount++;
    cardsHtml += `
      <div class="card ${st.done?'done':''}" data-exid="${ex.id}">
        <div class="card-top">
          <div class="icon-wrap">${ex.img ? `<img src="${ex.img}" alt="${ex.equip}" loading="lazy">` : ICONS[ex.icon]}</div>
          <div class="name-block">
            <p class="ex-name">${ex.name}</p>
            <p class="ex-equip">${ex.equip}</p>
          </div>
        </div>
        <p class="how-to">${ex.how}</p>
        ${ex.video ? `<video class="ex-video" controls muted playsinline loop preload="none"><source src="${ex.video}" type="video/webm"></video>` : ''}
        <div class="card-bottom">
          <span class="sets-badge">${ex.sets}</span>
          <div class="right-controls">
            <input class="weight-input" type="text" inputmode="decimal" placeholder="الوزن" value="${st.weight||''}">
            <button class="done-btn ${st.done?'on':''}">${st.done ? 'خلصت ✓' : 'خلصت؟'}</button>
          </div>
        </div>
      </div>`;
  }

  wrap.innerHTML = `
    <div class="section-title"><b>${day.full}</b></div>
    <div class="progress-line">
      <span id="progressText">${doneCount}/${list.length}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${(doneCount/list.length)*100}%"></div></div>
      <span>خلّصت</span>
    </div>
    <div id="cardsWrap">${cardsHtml}</div>
    <div class="reset-row"><button class="reset-btn" id="resetBtn">تصفير تمارين اليوم ده</button></div>
  `;

  wrap.querySelectorAll('.card').forEach(cardEl=>{
    const id = cardEl.dataset.exid;
    const weightInput = cardEl.querySelector('.weight-input');
    const doneBtn = cardEl.querySelector('.done-btn');
    weightInput.addEventListener('change', async ()=>{
      const cur = await loadState(`ex:${id}`, {done:false,weight:''});
      cur.weight = weightInput.value;
      await saveState(`ex:${id}`, cur);
    });
    doneBtn.addEventListener('click', async ()=>{
      const cur = await loadState(`ex:${id}`, {done:false,weight:''});
      cur.done = !cur.done;
      await saveState(`ex:${id}`, cur);
      renderExercises();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    for(const ex of list){
      const cur = await loadState(`ex:${ex.id}`, {done:false,weight:''});
      await saveState(`ex:${ex.id}`, {done:false, weight:cur.weight||''});
    }
    renderExercises();
  });
}

function buildChartSVG(entries){
  if(entries.length < 2){
    return `<div class="empty-note">سجّل وزنك مرتين على الأقل عشان يظهر الرسم البياني</div>`;
  }
  const w = 300, h = 140, pad = 20;
  const weights = entries.map(e=>e.weight);
  const min = Math.min(...weights) - 1;
  const max = Math.max(...weights) + 1;
  const xStep = (w - pad*2) / (entries.length - 1);
  const points = entries.map((e,i)=>{
    const x = pad + i*xStep;
    const y = h - pad - ((e.weight - min)/(max-min))*(h-pad*2);
    return `${x},${y}`;
  }).join(' ');
  const dots = entries.map((e,i)=>{
    const x = pad + i*xStep;
    const y = h - pad - ((e.weight - min)/(max-min))*(h-pad*2);
    return `<circle cx="${x}" cy="${y}" r="3.5" fill="#D4FF3E"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    <polyline points="${points}" fill="none" stroke="#D4FF3E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

async function renderWeight(){
  document.getElementById('headerSub').textContent = HEADER_SUBS.weight;
  const wrap = document.getElementById('mainContent');
  const log = await loadState('weightlog', []);
  const today = new Date().toISOString().slice(0,10);

  let logHtml = '';
  if(log.length === 0){
    logHtml = `<div class="empty-note">لسه معملتش أي تسجيل. سجّل وزنك الأول 👆</div>`;
  }else{
    for(let i=log.length-1;i>=0;i--){
      const e = log[i];
      let deltaHtml = '';
      if(i>0){
        const d = (e.weight - log[i-1].weight).toFixed(1);
        const cls = d>0?'up':(d<0?'down':'same');
        deltaHtml = `<span class="delta ${cls}">${d>0?'+':''}${d} كجم</span>`;
      }
      logHtml += `<div class="log-row" data-date="${e.date}"><div><div class="log-w">${e.weight} كجم</div><div class="log-date">${e.date}</div></div><div class="log-actions">${deltaHtml}<button class="del-btn" data-del="${e.date}">🗑️</button></div></div>`;
    }
  }

  const first = log[0];
  const last = log[log.length-1];
  const totalDiff = (first && last && log.length>1) ? (last.weight-first.weight).toFixed(1) : null;

  wrap.innerHTML = `
    <div class="hero-card">
      <div class="hero-label">إجمالي التغيير</div>
      <div class="hero-value">${totalDiff !== null ? (totalDiff>0?'+':'')+totalDiff+' كجم' : '—'}</div>
      <div class="hero-sub">${log.length>0 ? 'من أول تسجيل لحد دلوقتي' : 'سجّل وزنك كل أسبوع عشان يبان الفرق'}</div>
    </div>
    <div class="weight-form">
      <input type="date" id="wDate" value="${today}">
      <input type="number" id="wValue" placeholder="الوزن بالكيلو" inputmode="decimal">
      <button id="wAddBtn">إضافة</button>
    </div>
    <div class="chart-wrap">${buildChartSVG(log)}</div>
    <div id="logList">${logHtml}</div>
  `;

  document.getElementById('wAddBtn').addEventListener('click', async ()=>{
    const dateVal = document.getElementById('wDate').value || today;
    const wVal = parseFloat(document.getElementById('wValue').value);
    if(!wVal || wVal <= 0) return;
    const newLog = log.filter(e=>e.date !== dateVal);
    newLog.push({date:dateVal, weight:wVal});
    newLog.sort((a,b)=> a.date.localeCompare(b.date));
    await saveState('weightlog', newLog);
    renderWeight();
  });

  wrap.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const dateToDelete = btn.dataset.del;
      const newLog = log.filter(e=>e.date !== dateToDelete);
      await saveState('weightlog', newLog);
      renderWeight();
    });
  });
}

function switchSection(section){
  currentSection = section;
  setActiveNav();
  renderSubTabs();
  if(section==='home') renderHome();
  else if(section==='exercises') renderExercises();
  else if(section==='food') renderFood();
  else if(section==='weight') renderWeight();
  else if(section==='music') renderMusic();
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchSection(btn.dataset.section));
});

switchSection('home');
</script>

</body>
</html>
